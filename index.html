<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ChartPractice</title>
<style>
:root{color-scheme:light;--navy:#0f2f4d;--navy2:#16406a;--blue:#1663a6;--blue2:#0f4d84;--line:#c3d0dd;--line2:#dde5ec;--bg:#e8edf2;--ink:#1c2b3a;--mut:#5a6d7f;--gold:#f2b705;--red:#b3261e;--green:#0e7a3e;--purple:#5b2ea6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(15,47,77,.35);position:relative;z-index:20}
header b{font-size:21px;letter-spacing:.2px}.chip{background:var(--gold);color:#111;padding:3px 10px;border-radius:12px;font-weight:700;font-size:11px;letter-spacing:.4px}
header .env{margin-left:auto;font-size:12px;color:#cfe0ef;text-align:right}
nav.ws{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:#d7e0ea;border-bottom:2px solid #9fb3c8;position:sticky;top:0;z-index:15}
button{font:inherit;color:var(--ink);-webkit-text-fill-color:currentColor}
button,.btn{cursor:pointer;border:1px solid #7d97ad;background:#fff;color:var(--ink);padding:7px 12px;border-radius:6px;font-weight:600;transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:#eef3f8}button.on,.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue2)}.btn.warn{background:var(--red);color:#fff;border-color:var(--red)}
.btn.aiBtn{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:5px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
main{padding:14px 16px 22px;max-width:1280px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(28,43,58,.07)}
.card h2{margin:2px 0 8px;font-size:19px}.card h3{margin:2px 0 8px;font-size:16px}.card h4{margin:12px 0 6px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#eef3f8;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#3c546c}
tr.prow:hover{background:#f4f8fb}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #9fb3c8;border-radius:5px;margin:3px 0 9px;font:inherit;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec3e6;outline-offset:0;border-color:var(--blue)}
textarea{min-height:96px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;background:#e3eef7;border-radius:10px;padding:2px 8px;margin:2px;font-size:12px;font-weight:600}
.hud{position:sticky;top:53px;z-index:14;background:#fff3cd;border:2px solid var(--gold);padding:9px 14px;font-weight:700;display:none;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hud.red{background:#ffd7d7;border-color:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.62}}
.flagH{color:var(--red);font-weight:700}.flagL{color:var(--blue);font-weight:700}
footer{background:var(--navy);color:#cfe0ef;padding:9px 16px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.big{font-size:27px;font-weight:700;line-height:1.1}
.bar{height:10px;background:#e3eaf1;border-radius:6px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#3f97dd)}
.banner{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;border-radius:8px;padding:13px 16px;margin-bottom:10px;box-shadow:0 2px 6px rgba(15,47,77,.3)}
.banner .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#9fc2e2}
.actnav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.actnav button{cursor:pointer;border:1px solid #7d97ad;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);padding:6px 11px;border-radius:6px;font-weight:600}
.actnav button.on{background:var(--blue);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--blue)}
.qcard{border:2px solid var(--purple);background:#faf7ff}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kv div{background:#f4f8fb;border:1px solid var(--line2);border-radius:6px;padding:8px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:3px 10px;margin:2px;font-size:12px;background:#f7fafc}.badge.earned{background:#fff6d8;border-color:var(--gold);font-weight:700}
.linkrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.wssec,.actsec{scroll-margin-top:118px}
.seclabel{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#3c546c;margin:18px 0 6px;border-bottom:2px solid #9fb3c8;padding-bottom:4px}
details.phrase{border-bottom:1px solid var(--line2);padding:6px 0}details.phrase summary{cursor:pointer;font-weight:700;color:var(--blue2)}
.msg-unread{font-weight:600}.dot{color:var(--red);font-weight:900}
@media(max-width:640px){main{padding:10px}header .env{display:none}.hud{top:96px}}
/* ===== LIVE BEDSIDE MONITOR ===== */
.mon{background:#04090d;color:#cfe8d8;border:2px solid #2b3f4d;border-radius:10px;padding:12px 14px;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.monhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #223544;padding-bottom:8px;margin-bottom:8px}
.monhead b{color:#fff;font-size:16px;letter-spacing:.3px}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:monblink 1.2s infinite;vertical-align:middle}
@keyframes monblink{50%{opacity:.25}}
.mon canvas.wave{width:100%;height:248px;display:block;background:#010507;border:1px solid #1b2c38;border-radius:6px}
.mon canvas.trend{width:100%;height:92px;display:block;background:#010507;border:1px solid #1b2c38;border-radius:6px;margin-top:8px}
.montiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:10px 0}
.mtile{background:#08131a;border:1px solid #223544;border-radius:8px;padding:7px 10px;min-height:86px}
.mtile .mlab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.mtile .mv{font-family:Consolas,"SF Mono",monospace;font-size:31px;font-weight:800;line-height:1.05}
.mtile .mun{font-size:11px;color:#8fa8b5}
.mtile .mlim{font-size:11px;color:#7d97a5}
.cHR{color:#39ff6a}.cSpO2{color:#37c8ff}.cRR{color:#ffd83d}.cBP{color:#ff6055}.cTemp{color:#f2f5f7}.cEtCO2{color:#ff9f2e}
.mtile.alarm{background:#4d0d0a;border-color:#ff3b30;animation:tileflash .8s infinite}
@keyframes tileflash{50%{background:#2a0705}}
.monbanner{border-radius:6px;padding:9px 12px;font-weight:700;margin:8px 0;display:none}
.monbanner.show{display:block}
.monbanner.crit{background:#5c0f0a;color:#fff;border:2px solid #ff3b30;animation:tileflash .8s infinite}
.monbanner.warnb{background:#4d3b00;color:#ffe27a;border:2px solid #f2b705}
.monbanner.okb{background:#0a2e17;color:#7de2a0;border:1px solid #1d5c33}
.monbtns{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}
.mon .btn{background:#12232f;color:#e6f2f7;border-color:#3c5a6e}
.mon .btn.primary{background:#1663a6;color:#fff;border-color:#1663a6}
.mon .btn.warnb2{background:#b3261e;color:#fff;border-color:#b3261e}
.monmeta{font-size:12.5px;color:#9fc0cf}
.trapnote{background:#3d2b00;border:1px solid #f2b705;color:#ffe9a3;border-radius:6px;padding:8px 11px;margin-top:8px;font-size:13px}

</style></head><body>

function fillTokens(t){const p=P();return t.replace(/@NAME@/g,p.name).replace(/@MRN@/g,p.mrn).replace(/@AGE@/g,String(p.age)).replace(/@UNIT@/g,p.unit).replace(/@ROOM@/g,p.room).replace(/@DX@/g,p.dx).replace(/@DEVICE@/g,p.device)}
function totalPts(){return S.runs.reduce((a,r)=>a+(r.pts||0),0)}
function medal(pts,max){if(max<=0)return'Complete';const r=pts/max;return r>=.85?'🥇 Gold':r>=.6?'🥈 Silver':r>=.35?'🥉 Bronze':'Complete'}
const LEVELS=[["RRT Student",0],["Clinician",500],["Senior RT",1200],["Preceptor",2200],["NBRC Ready",3500]];
function level(pts){let c=LEVELS[0],n=null;for(let i=0;i<LEVELS.length;i++){if(pts>=LEVELS[i][1]){c=LEVELS[i];n=LEVELS[i+1]||null}}return{cur:c,nxt:n,pct:n?Math.min(100,Math.round((pts-c[1])/(n[1]-c[1])*100)):100}}
function rangesFor(type){if(type==='arterial')return{pH:[7.35,7.45],PaCO2:[35,45],HCO3:[22,26],PaO2:[80,100],label:'arterial'};if(type==='capillary')return{pH:[7.32,7.42],PaCO2:[35,50],HCO3:[22,26],PaO2:[40,60],label:'capillary'};return{pH:[7.32,7.43],PaCO2:[41,51],HCO3:[22,26],PaO2:[30,50],label:'venous'}}
function abgRead(a){const r=rangesFor(a.type);const keys=[['pH',a.pH],['PaCO2',a.PaCO2],['HCO3',a.HCO3],['PaO2',a.PaO2]];const out=[];for(const[k,v]of keys){if(v==null||isNaN(v))continue;if(v<r[k][0])out.push(k+' <span class="flagL">L</span>');else if(v>r[k][1])out.push(k+' <span class="flagH">H</span>')}const interp=a.pH<7.35?'Respiratory acidosis pattern':a.pH>7.45?'Alkalosis pattern':'pH in range';return(out.join(', ')||'All values in range')+' — '+interp+' ('+r.label+' reference ranges)'}

<script>

const CARE_TIPS={1:"Delgado: chart the vent check first, then reassess breath sounds and SpO₂ after any setting change.",2:"Okafor: pair every neb with pre/post HR and breath sounds, and finish the MDI + spacer teach-back.",3:"Lindqvist: coach incentive spirometry hourly while awake and document the volume achieved, not just 'done'.",4:"Reyes: chart the high-flow device column — flow, FiO₂ and SpO₂ response — every check.",5:"Kowalski: lung-protective settings — verify plateau and driving pressure on every vent check; P/F 82 is severe ARDS.",6:"Chen: never trust the pulse-ox number alone — COHb 24% needs co-oximetry and 100% O₂.",7:"Novak: airway clearance before aerosolized therapy, and chart secretion amount and color.",8:"Haddad: trend VC / NIF / MEP together — the 20/30/40 rule only works as a series.",9:"Fitzgerald: BiPAP fit and leak first, then SpO₂ and work of breathing after 15–30 minutes.",10:"Brooks: LTOT decision rests on the resting room-air gas — PaO₂ 54 qualifies (≤55).",11:"Petrov: chest tube stays below chest level and is never clamped without an order.",12:"Silva: a rising PaCO₂ means she is tiring — escalate early and keep the continuous neb running.",13:"Noah: beractant 168 mg (6.7 mL) at 100 mg/kg is due 15:00 — verify weight and dose before giving."};
function aiFindings(){const p=P();const due=S.mar.filter(m=>m.status==='Due');const unsigned=S.notes.filter(n=>n.status==='Draft');const never=S.patients.filter(x=>!S.flows.some(f=>f.pid===x.id));const staleVent=p.id===1&&!S.flows.some(f=>f.pid===1&&f.group==='Ventilator');const pendVent=S.patients.filter(x=>/ventilator/i.test(x.device)&&!S.charges.some(c=>c.pid===x.id&&c.code==='94003'));const pendNeb=S.patients.filter(x=>/neb/i.test(x.device)&&!S.charges.some(c=>c.pid===x.id&&c.code==='94640'));const rec=[];if(staleVent)rec.push({t:'Start with Delgado (ICU-4): her vent check is stale — file a Ventilator flowsheet column now.',pid:1,a:'flow'});if(due.length)rec.push({t:'Give due MAR next: '+due.slice(0,3).map(m=>m.med+' @ '+m.time+' ('+(S.patients.find(x=>x.id===m.pid)||{}).name+')').join('; ')+'.',pid:due[0].pid,a:'mar'});if(unread())rec.push({t:'Clear In Basket: '+unread()+' unread — Results and Cosign folders first.',pid:null,a:null});if(unsigned.length)rec.push({t:'Sign or finish '+unsigned.length+' draft note(s) — unsigned drafts are the #1 chart-hygiene miss.',pid:unsigned[0].pid,a:'notes'});if(never.length)rec.push({t:'No flowsheet column yet for: '+never.slice(0,4).map(x=>x.name).join(', ')+' — chart a device column for one of them.',pid:never[0].id,a:'flow'});if(pendVent.length)rec.push({t:'Pending charge: '+pendVent[0].name+' is ventilated with no 94003 captured yet.',pid:pendVent[0].id,a:'charges'});else if(pendNeb.length)rec.push({t:'Pending charge: '+pendNeb[0].name+' has nebulizer therapy with no 94640 captured yet.',pid:pendNeb[0].id,a:'charges'});if(!S.runs.length)rec.push({t:'Run your first timed challenge — Kowalski ARDS (5 min) from Patient Lists.',pid:null,a:null});return{staleVent,due,unsigned,never,rec}}
function viewAI(){const f=aiFindings();const p=P();const tp=totalPts();const lv=level(tp);const best=S.runs.slice().sort((a,b)=>b.pts-a.pts)[0];const well=[];if(S.notes.filter(n=>n.status==='Signed').length)well.push(S.notes.filter(n=>n.status==='Signed').length+' signed note(s) on file');if(S.flows.length)well.push(S.flows.length+' flowsheet column(s) filed');if(S.mar.filter(m=>m.status==='Given').length)well.push(S.mar.filter(m=>m.status==='Given').length+' MAR dose(s) given');if(S.runs.length)well.push(S.runs.length+' challenge run(s) — best '+(best?best.pts+' pts '+best.medal:''));if(S.drills.length)well.push(S.drills.length+' drill(s) timed');const headline=f.staleVent?'Headline: Delgado\u2019s vent check is stale — start there.':(f.due.length?'Headline: '+f.due.length+' MAR dose(s) are due — clear those first.':'Headline: charting is tidy — push a timed challenge next.');
let h=`<div class="card" style="border:2px solid var(--purple)"><h2>✦ AI AGENT</h2><p class="mut">Briefing built from your real practice record on this device — due MAR, unsigned drafts, unread In Basket, pending charges, flowsheets, challenge scores and drill times.</p><h3>${esc(headline)}</h3><p><b>Open chart:</b> ${esc(p.name)} — ${esc(p.dx)} • Level: ${lv.cur[0]} (${tp} pts)</p><h4>Prioritized recommendations — excel in charting</h4>`;h+=f.rec.length?`<ol>${f.rec.map(r=>`<li>${esc(r.t)} ${r.pid?`<button class="btn small primary" onclick="jumpTo(${r.pid},'${r.a}')">Open the chart</button>`:''} ${!r.pid&&r.t.includes('In Basket')?`<button class="btn small primary" onclick="setWs('inbasket')">Open In Basket</button>`:''} ${!r.pid&&r.t.includes('challenge')?`<button class="btn small primary" onclick="setWs('lists')">Open Challenge Board</button>`:''}</li>`).join('')}</ol>`:'<p class="ok">Nothing outstanding — every queue is clear.</p>';

function monReset(pid){

function monitorHtml(p){

function monDrift(key,noise,lo,hi,pull){const c=MON.cur,b=MON.base;c[key]+=(b[key]-c[key])*(pull||0.06)+(Math.random()-0.5)*2*noise;if(c[key]<lo)c[key]=lo;if(c[key]>hi)c[key]=hi}
function monBreaches(){
  if(!MON)return[];const c=MON.disp||MON.cur,L=MON.base.lim,out=[];
  const chk=(k,v,lo,hi,lab)=>{if(v<lo)out.push({k,msg:'*** '+lab+' '+Math.round(v)+' — BELOW low alarm '+lo});else if(v>hi)out.push({k,msg:'*** '+lab+' '+Math.round(v)+' — ABOVE high alarm '+hi})};
  chk('HR',c.HR,L.HR[0],L.HR[1],'HR'); chk('RR',c.RR,L.RR[0],L.RR[1],'RR'); chk('SYS',c.SYS,L.SYS[0],L.SYS[1],'Systolic');
  if(c.SpO2<L.SpO2[0])out.push({k:'SpO2',msg:'*** SpO₂ '+Math.round(c.SpO2)+'% — BELOW low alarm '+L.SpO2[0]+'%'});
  if(c.EtCO2&&L.EtCO2&&(c.EtCO2<L.EtCO2[0]||c.EtCO2>L.EtCO2[1]))out.push({k:'EtCO2',msg:'*** EtCO₂ '+Math.round(c.EtCO2)+' — OUTSIDE alarm '+L.EtCO2[0]+'–'+L.EtCO2[1]});

}
function monTick(){
  const p=P(); if(!p)return;
  if(!MON||MON.pid!==p.id){if(document.querySelector('#monRoot')){/* render will rebuild */} monReset(p.id);}
  const b=MON.base,c=MON.cur,now=Date.now();

  monDrift('RR',b.neo?2.4:1.3,b.RR-(b.neo?14:7),b.RR+(b.neo?14:7));
  monDrift('SpO2',0.55,Math.max(68,b.SpO2-3),Math.min(100,b.SpO2+2),0.09); c.SpO2=Math.round(c.SpO2*2)/2;
  monDrift('Temp',0.015,b.Temp-0.25,b.Temp+0.25,0.03);
  monDrift('SYS',b.neo?1.6:3.2,b.SYS-(b.neo?9:13),b.SYS+(b.neo?9:13));
  monDrift('DIA',b.neo?1.2:2.2,b.DIA-9,b.DIA+9);
  if(c.EtCO2)monDrift('EtCO2',0.8,b.etco2-4,b.etco2+4);

    if(n.inflUntil&&now>=n.inflUntil){n.inflUntil=0;n.sys=Math.round(c.SYS);n.dia=Math.round(c.DIA);n.map=Math.round(n.dia+(n.sys-n.dia)/3);n.doneAt=now;n.next=now+45000}
    else if(!n.inflUntil&&now>=n.next){n.inflUntil=now+4000}
  }

  if(MON.evt&&now>MON.evt.until)MON.evt=null;
  if(!MON.evt&&Math.random()<0.022){const evs=[['SpO2',-5],['HR',b.neo?18:15],['RR',b.neo?9:7]];const e=evs[Math.floor(Math.random()*evs.length)];
    MON.evt={key:e[0],off:e[1],until:now+7000+Math.random()*6000,setAt:now}}
  const disp=Object.assign({},c);
  if(MON.evt){const age=(now-MON.evt.setAt)/1000;const ramp=Math.min(1,age/2.5);const left=(MON.evt.until-now)/1000;const fade=Math.min(1,left/2.5);
    disp[MON.evt.key]+=MON.evt.off*Math.max(0,Math.min(ramp,fade))}

}
function monBreachesRaw(){const save=MON.ack;MON.ack={};const r=monBreaches();MON.ack=save;return r}
function setTxt(id,v){const e=document.querySelector('#'+id);if(e)e.textContent=v}

  setTxt('mon-SpO2',String(Math.round(c.SpO2))); setTxt('mon-Temp',c.Temp.toFixed(1));

function monSilence(){if(!MON)monReset(P().id);MON.silencedUntil=Date.now()+120000;monPaint(Date.now());setStatus('Monitor alarms silenced for 2 minutes')}
function monAck(){if(!MON)monReset(P().id);monBreachesRaw().forEach(x=>MON.ack[x.k]=1);monPaint(Date.now());setStatus('Monitor alarms acknowledged — they re-arm when the value returns to range')}
function monSound(){if(!MON)monReset(P().id);MON.sound=!MON.sound;

function gss(x,c,w){const d=(x-c)/w;return Math.exp(-d*d)}
function ecgVal(ph){return 0.13*gss(ph,0.12,0.035)-0.16*gss(ph,0.285,0.012)+1.0*gss(ph,0.315,0.010)-0.28*gss(ph,0.345,0.014)+0.24*gss(ph,0.56,0.055)}
function plethVal(ph){ph=((ph%1)+1)%1;return ph<0.16?Math.pow(Math.sin(ph/0.16*Math.PI/2),1.4):Math.exp(-(ph-0.16)*3.4)*(1+0.10*gss(ph,0.34,0.05))}
function artVal(ph){ph=((ph%1)+1)%1;return ph<0.09?(ph/0.09):Math.exp(-(ph-0.09)*4.2)+0.22*gss(ph,0.32,0.045)}
function respVal(ph){ph=((ph%1)+1)%1;return ph<0.38?0.5-0.5*Math.cos(ph/0.38*Math.PI):Math.exp(-(ph-0.38)*3.2)}
function capVal(ph){ph=((ph%1)+1)%1;return ph<0.10?ph/0.10:(ph<0.42?1:(ph<0.52?1-(ph-0.42)/0.10:0))}
function drawWave(){
  const cv=document.querySelector('#monWave'); if(!cv||!MON)return;
  const p=P(); if(!p||p.id!==MON.pid)return;
  const ctx=cv.getContext('2d'); if(!ctx)return; const W=cv.width,H=cv.height,now=performance.now()/1000;

  for(let gx=0;gx<W;gx+=23){ctx.moveTo(gx,0);ctx.lineTo(gx,H)} for(let gy=0;gy<H;gy+=23){ctx.moveTo(0,gy);ctx.lineTo(W,gy)} ctx.stroke();

              ['SpO₂ pleth',null,'#37c8ff',54,t=>plethVal((t*c.HR/60-0.22)%1)],
              ['RESP',null,'#ffd83d',54,t=>respVal((t*c.RR/60)%1)]];

    ctx.strokeStyle=r[2];ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<=W;x+=2){const t=now-(W-x)/W*win;const v=r[4](t);const y=yBase-v*amp;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();ctx.fillStyle=r[2];ctx.font='bold 12px Consolas,monospace';ctx.fillText(r[0],8,i*rh+16);
    ctx.fillStyle='rgba(160,190,205,.75)';ctx.font='11px Consolas,monospace';
    const rv=r[0].indexOf('ECG')>0?Math.round(c.HR)+' bpm':r[0].indexOf('pleth')>0?Math.round(c.SpO2)+' %':r[0].indexOf('RESP')===0?Math.round(c.RR)+' /min':b.art?Math.round(c.SYS)+'/'+Math.round(c.DIA):Math.round(c.EtCO2||0)+' mmHg';

function drawTrend(){

    MON.hist.forEach((s,i)=>{const x=i/(299)*W;const y=H-((Math.max(lo,Math.min(hi,s[key]))-lo)/(hi-lo))*(H-10)-5;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke()};

}
function captureVitals(){
  const p=P(); if(!MON||MON.pid!==p.id)monReset(p.id);
  const b=MON.base,c=MON.disp||MON.cur;
  const bp=b.art?Math.round(c.SYS)+'/'+Math.round(c.DIA):MON.nibp.sys+'/'+MON.nibp.dia;

setInterval(monTick,1000);
setInterval(drawWave,50);

<script>
function startChallenge(i){const c=CHALLENGES[i];if(CH&&!confirm('A challenge is already running — abandon it and start this one?'))return;if(CH)clearInterval(CH.iv);CH={idx:i,tasks:c.tasks.slice(),done:{},taskPts:0,qPts:0,pen:0,wrong:0,qDone:false,end:Date.now()+c.mins*60000,iv:null};cur=c.pid;act='summary';ws='chart';$$('#ws button').forEach(x=>x.classList.toggle('on',x.dataset.w==='chart'));CH.iv=setInterval(tickHud,250);render();updateHud();alert('Challenge started: '+c.name+' — '+c.mins+' minutes.\n\nTasks:\n• '+c.tasks.map(t=>TASKLABEL[t]).join('\n• ')+'\n\nThen answer the end question — it appears at the top of the page as soon as every charting step is done. Wrong picks cost 50 pts; the first attempt is the scored one.');scrollToId('ws-chart')}
function updateHud(){const hud=$('#hud');if(!hud)return;if(!CH){hud.style.display='none';return}hud.style.display='flex';tickHudText()}
function tickHudText(){if(!CH)return;const c=CHALLENGES[CH.idx];const left=Math.max(0,CH.end-Date.now());const s=Math.ceil(left/1000);const doneN=Object.keys(CH.done).length;const pts=Math.max(0,CH.taskPts+CH.qPts-CH.pen);$('#hud').classList.toggle('red',left<60000&&left>0);$('#hudTxt').textContent='🏆 '+c.name+' — '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' left • Steps '+doneN+'/'+CH.tasks.length+' charting'+(questionReady()?' • End question ready':'')+(CH.qDone?' • Question answered':'')+' • '+pts+' pts';const qb=$('#hudQBtn');if(qb)qb.style.display=questionReady()?'':'none'}

function noteTask(kind){if(!CH)return;const c=CHALLENGES[CH.idx];if(cur!==c.pid)return;if(CH.tasks.includes(kind)&&!CH.done[kind]){CH.done[kind]=1;CH.taskPts+=100;tickHudText();if(questionReady()){render();const q=$('#qCard');if(q)q.scrollIntoView({behavior:'smooth',block:'start'})}}}
function questionCard(){const c=CHALLENGES[CH.idx];return `<div class="card qcard" id="qCard"><h3>End question — ${esc(c.name)}</h3><p><b>${esc(c.q)}</b></p>${c.opts.map((o,i)=>`<p><button class="btn" id="qopt${i}" onclick="ansQ(${i})">${esc(o)}</button></p>`).join('')}<p class="mut">Wrong picks: −50 pts each and that option locks. The question stays here at the top until you answer it — you can navigate anywhere and come back.</p></div>`}
function jumpToQuestion(){const q=$('#qCard');if(q){q.scrollIntoView({behavior:'smooth',block:'start'});return}render();setTimeout(()=>{const q2=$('#qCard');if(q2)q2.scrollIntoView({behavior:'smooth',block:'start'})},50)}
function ansQ(i){if(!CH||CH.qDone)return;const c=CHALLENGES[CH.idx];if(i===c.ans){CH.qDone=true;CH.qPts=150;finishChallenge('complete')}else{CH.wrong++;CH.pen+=50;const b=$('#qopt'+i);if(b){b.disabled=true;b.style.textDecoration='line-through'}tickHudText();alert('Not quite — −50 pts. First attempt is scored; pick again.')}}
function endRunManual(){if(!CH)return;if(!confirm('End this run now? It will be recorded as ended early.'))return;finishChallenge('manual')}
function finishChallenge(reason){if(!CH)return;const c=CHALLENGES[CH.idx];clearInterval(CH.iv);const doneN=Object.keys(CH.done).length;const timeBonus=reason==='complete'?Math.max(0,Math.round((CH.end-Date.now())/1000)):0;const total=Math.max(0,CH.taskPts+CH.qPts+timeBonus-CH.pen);const max=c.tasks.length*100+150+c.mins*60;const md=medal(total,max);const completed=reason==='complete';const run={name:c.name,pts:total,medal:md,when:nowStr(),completed};S.runs.push(run);save();const taskPts=CH.taskPts,qPts=CH.qPts,pen=CH.pen,wrong=CH.wrong,qDone=CH.qDone;CH=null;const hud=$('#hud');if(hud)hud.style.display='none';ws='chart';$('#app').innerHTML=`<div class="card"><h2>Debrief — ${esc(c.name)}</h2><p style="font-size:20px">${esc(md)} — <b>${total} pts</b> ${completed?'<span class="ok">Run completed</span>':reason==='timeout'?'<span class="bad">Time expired</span>':'<span class="mut">Ended early</span>'}</p><p><b>Points breakdown</b></p><table><tr><th>Component</th><th>Points</th></tr><tr><td>Charting tasks — ${doneN}/${c.tasks.length} done (100 each)</td><td>${taskPts}</td></tr><tr><td>End question ${qDone?'(answered)':'(not answered)'}</td><td>${qPts}</td></tr><tr><td>Time bonus (seconds left, completed runs only)</td><td>${timeBonus}</td></tr><tr><td>Penalties — ${wrong} wrong pick(s) at −50</td><td>−${pen}</td></tr><tr><td><b>Total</b></td><td><b>${total}</b></td></tr></table><p><b>Level now:</b> ${level(totalPts()).cur[0]} — ${totalPts()} pts total</p><p><b>Exam pearl:</b> ${esc(c.pearl)}</p><button class="btn primary" onclick="setWs('lists')">Back to Patient Lists &amp; Challenge Board</button></div>`;$$('#ws button').forEach(x=>x.classList.toggle('on',x.dataset.w==='chart'));$('#unreadBadge').textContent=unread()?' ('+unread()+' unread)':'';setStatus('Debrief: '+c.name+' — '+total+' pts '+md)}
render();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ChartPractice</title>
<style>
:root{color-scheme:light;--navy:#0a2e57;--navy2:#16467c;--blue:#0e5aa8;--blue2:#0a2e57;--teal:#0e7c86;--accent:#0e7c86;--purple:#0e7c86;--line:#a9b9cf;--line2:#ccd7e5;--bg:#d7dfea;--salt:#eef2f7;--galt:#f6f9fc;--ink:#17233a;--mut:#4d5f7a;--faint:#8494ab;--gold:#f5c542;--red:#b3261e;--green:#1e7d32;--warn:#7c5200;--warnbg:#fdf0cd;--okbg:#e3f2e6;--alertbg:#fdecea}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.42}
header{background:var(--navy);color:#fff;padding:8px 14px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:20}
.hgroup{display:flex;align-items:center;gap:9px}
.logo{width:28px;height:28px;background:rgba(255,255,255,.16);border-radius:4px;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.wordmark{font-size:17px;font-weight:700;letter-spacing:-.2px;color:#fff}
.wordmark .teal{color:#8fd8de}
.chip{background:var(--gold);color:#4d3800;padding:2px 8px;border-radius:3px;font-weight:700;font-size:11px;letter-spacing:.4px;display:inline-block}
header .env{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.envrow{display:flex;align-items:center;gap:10px}
.who{font-size:12.5px;color:#dbe7f2;text-align:right;line-height:1.3}
.who b{font-size:13.5px;color:#fff}
#clock{font-size:11px;color:#b9cfe2}
.envbanner{background:var(--warnbg);border-bottom:1px solid #d9a400;color:var(--warn);font-weight:700;font-size:12.5px;padding:5px 14px}
nav.ws{display:flex;gap:4px;flex-wrap:wrap;padding:0 12px;background:var(--navy);position:sticky;top:0;z-index:15;align-items:flex-end}
nav.ws button{border:0;border-radius:6px 6px 0 0;background:#1d4066;color:#fff;-webkit-text-fill-color:#fff;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:none}
nav.ws button:hover{background:#2a4f7c}
nav.ws button.on{background:var(--bg);color:var(--navy);-webkit-text-fill-color:var(--navy);font-weight:700}
nav.ws button.aiBtn{background:#17616e;color:#fff;-webkit-text-fill-color:#fff;font-weight:700;letter-spacing:.3px}
nav.ws button.aiBtn.on{background:var(--bg);color:var(--navy);-webkit-text-fill-color:var(--navy)}
#unreadBadge{display:inline-block;background:var(--red);color:#fff;-webkit-text-fill-color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700;margin-left:5px;line-height:1.5}
#unreadBadge:empty{display:none}
button{font:inherit;color:var(--ink);-webkit-text-fill-color:currentColor}
button,.btn{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:4px;font-weight:600;font-size:13.5px;box-shadow:0 1px 2px rgba(23,35,58,.06)}
button:hover,.btn:hover{background:var(--salt)}
button.on,.btn.primary{background:var(--navy);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2)}
.btn.warn{background:var(--red);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--red)}
.btn.aiBtn{background:var(--teal);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--teal)}
.btn.small{padding:3px 9px;font-size:12px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);box-shadow:none}
main{padding:12px 14px 22px;max-width:1600px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(23,35,58,.05)}
.card>h2:first-child,.card>h3:first-child{background:#e8eef5;border-bottom:1px solid var(--line);margin:-12px -14px 10px;padding:7px 12px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);border-radius:4px 4px 0 0;line-height:1.35}
.card>h2:first-child .hsub,.card>h3:first-child .hsub{text-transform:none;letter-spacing:0;color:var(--mut);font-weight:600;font-size:12.5px;margin-left:8px}
.card>h2:first-child .hright,.card>h3:first-child .hright{float:right;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:600;font-size:12.5px}
.card h2{font-size:15px;margin:12px 0 8px;color:var(--navy)}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--navy)}
.card>h3:first-child{margin:-12px -14px 10px}
.card h3:not(:first-child){border-bottom:1px solid var(--line2);padding-bottom:4px}
.card h4{margin:12px 0 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);background:var(--salt);border:1px solid var(--line2);padding:4px 8px;border-radius:3px}
.card>h4:first-child{margin-top:0}
.card p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f2f5f9;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
tr.prow:hover{background:#e8f1fa}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* census — screenshot layout: unit strips, status dot, blue name link */
.unitbar{background:#e6edf5;color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-bottom:0;margin:12px 0 0;border-radius:4px 4px 0 0}
table.census{border:1px solid var(--line);background:#fff}
table.census th{padding:6px 10px}
table.census td{padding:10px;border-bottom:1px solid var(--line2)}
table.census tr.prow:nth-child(even){background:var(--galt)}
.sdot{width:10px;height:10px;border-radius:50%;background:#2e7d32;display:inline-block;margin-right:8px;vertical-align:middle}
.roomcell{white-space:nowrap;font-size:14px}
.plink{color:var(--blue);font-weight:700;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer;font-size:14.5px}
.plink:hover{color:var(--navy2)}
#unitPills{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.upill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:6px 13px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:none}
.upill:hover{background:var(--salt)}
.upill.on{background:var(--navy);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--navy);font-weight:700}
.searchrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.searchrow input{flex:1 1 260px;width:auto;margin:0}
.searchrow .btn{margin:0}
label{font-size:12px;font-weight:600;color:var(--mut)}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin:3px 0 8px;font:inherit;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);box-shadow:inset 0 1px 2px rgba(23,35,58,.06)}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec3e6;outline-offset:0;border-color:var(--blue)}
textarea{min-height:96px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:260px 1fr;gap:12px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;background:#e3eaf2;border-radius:3px;padding:1px 7px;margin:2px;font-size:11.5px;font-weight:600;color:var(--ink)}
.hud{position:sticky;top:41px;z-index:14;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;padding:8px 12px;font-weight:600;display:none;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;box-shadow:0 1px 3px rgba(23,35,58,.08)}
.hud.red{background:var(--alertbg);border-color:var(--red);border-left-color:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.7}}
.flagH{color:var(--red);font-weight:700}.flagL{color:var(--blue);font-weight:700}
footer{background:var(--navy);color:#cfe0ef;padding:6px 14px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
footer b{color:#fff}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.big{font-size:22px;font-weight:700;line-height:1.15;color:var(--navy)}
.bar{height:8px;background:#e3eaf1;border-radius:3px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--blue)}
.banner{background:#fff;color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:4px;padding:10px 12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.bavatar{width:44px;height:44px;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:16px;flex:none;letter-spacing:.5px}
.bmain{flex:1 1 320px;min-width:240px}
.bname{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
.bfields{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:3px}
.bfield{display:inline-flex;align-items:baseline;gap:5px;font-size:13.5px}
.bfield .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.bdx{margin-top:3px;font-size:13.5px}
.banner .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
.actnav{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px;background:var(--salt);border:1px solid var(--line);border-radius:4px;padding:4px}
.actnav button{cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);padding:5px 11px;border-radius:4px;font-weight:600;box-shadow:none}
.actnav button:hover{background:#fff}
.actnav button.on{background:#fff;color:var(--navy);-webkit-text-fill-color:var(--navy);border-color:var(--line);font-weight:700;box-shadow:0 1px 2px rgba(23,35,58,.08)}
.qcard{border:1px solid var(--line);border-top:3px solid var(--teal);background:#fbfcfd}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kv div{background:var(--salt);border:1px solid var(--line2);border-radius:4px;padding:7px 9px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:3px 9px;margin:2px;font-size:12px;background:#f7fafc;color:var(--mut)}
.badge.earned{background:var(--warnbg);border-color:#d9a400;font-weight:700;color:var(--warn)}
.linkrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.wssec,.actsec{scroll-margin-top:118px}
.seclabel{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin:16px 0 8px;background:#e8eef5;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
details.phrase{border-bottom:1px solid var(--line2);padding:6px 0}details.phrase summary{cursor:pointer;font-weight:700;color:var(--blue)}
.msg-unread{font-weight:600}.dot{color:var(--red);font-weight:900}
table.flowgrid tr.latest td{background:#e8f1fa;font-weight:600}
table.flowgrid tr:not(.latest):nth-child(even) td{background:var(--galt)}
#trainerTimer>h3:first-child{background:none;border-bottom:0;margin:0 0 4px;padding:0;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--navy)}
#trainerTimer select{width:auto;min-width:230px;max-width:100%}
.phrasemenu{position:fixed;z-index:99;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 22px rgba(10,46,87,.22);max-width:min(460px,94vw);max-height:272px;overflow:auto;padding:4px}
.phrasemenu .pmhint{font-size:11px;color:var(--mut);padding:5px 9px 3px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.phrasemenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);padding:7px 9px;border-radius:3px;font-weight:400;cursor:pointer;box-shadow:none}
.phrasemenu button .pmkey{font-weight:700;color:var(--blue)}
.phrasemenu button .pmprev{color:var(--mut);font-size:12.5px}
.phrasemenu button.hl{background:var(--blue);color:#fff;-webkit-text-fill-color:#fff}
.phrasemenu button.hl .pmkey,.phrasemenu button.hl .pmprev{color:#fff;-webkit-text-fill-color:#fff}
@media(max-width:640px){main{padding:10px}.who{display:none}.hud{top:78px}header .env{align-items:flex-end}}
/* ===== LIVE BEDSIDE MONITOR ===== */
.mon{background:#04090d;color:#cfe8d8;border:1px solid #2b3f4d;border-top:3px solid #2b3f4d;border-radius:4px;padding:12px 14px}
.mon h4{background:transparent;border:0;text-transform:none;letter-spacing:0}
.monhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #223544;padding-bottom:8px;margin-bottom:8px}
.monhead b{color:#fff;font-size:15px;letter-spacing:.3px}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:monblink 1.2s infinite;vertical-align:middle}
@keyframes monblink{50%{opacity:.25}}
.mon canvas.wave{width:100%;height:248px;display:block;background:#010507;border:1px solid #1b2c38;border-radius:4px}
.mon canvas.trend{width:100%;height:92px;display:block;background:#010507;border:1px solid #1b2c38;border-radius:4px;margin-top:8px}
.montiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:10px 0}
.mtile{background:#08131a;border:1px solid #223544;border-radius:4px;padding:7px 10px;min-height:86px}
.mtile .mlab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.mtile .mv{font-family:Consolas,"SF Mono",monospace;font-size:28px;font-weight:800;line-height:1.05}
.mtile .mun{font-size:11px;color:#8fa8b5}
.mtile .mlim{font-size:11px;color:#7d97a5}
.cHR{color:#39ff6a}.cSpO2{color:#37c8ff}.cRR{color:#ffd83d}.cBP{color:#ff6055}.cTemp{color:#f2f5f7}.cEtCO2{color:#ff9f2e}
.mtile.alarm{background:#4d0d0a;border-color:#ff3b30;animation:tileflash .8s infinite}
@keyframes tileflash{50%{background:#2a0705}}
.monbanner{border-radius:4px;padding:8px 12px;font-weight:700;margin:8px 0;display:none}
.monbanner.show{display:block}
.monbanner.crit{background:#5c0f0a;color:#fff;border:2px solid #ff3b30;animation:tileflash .8s infinite}
.monbanner.warnb{background:#4d3b00;color:#ffe27a;border:2px solid #f2b705}
.monbanner.okb{background:#0a2e17;color:#7de2a0;border:1px solid #1d5c33}
.monbtns{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}
.mon .btn{background:#12232f;color:#e6f2f7;border-color:#3c5a6e;box-shadow:none}
.mon .btn.primary{background:#0e5aa8;color:#fff;border-color:#0e5aa8}
.mon .btn.warnb2{background:#b3261e;color:#fff;border-color:#b3261e}
.monmeta{font-size:12.5px;color:#9fc0cf}
.trapnote{background:#3d2b00;border:1px solid #f2b705;color:#ffe9a3;border-radius:4px;padding:8px 11px;margin-top:8px;font-size:13px}
/* ===== IMAGING ===== */
.filmwrap{background:#0a0f14;border:1px solid #2b3f4d;border-radius:4px;padding:12px;text-align:center}
.filmwrap svg{max-width:100%;height:auto;display:block;margin:0 auto}
.filmlabel{background:#3d2b00;border:1px solid #f2b705;color:#ffe9a3;border-radius:4px;padding:7px 10px;font-weight:700;font-size:12.5px;margin-bottom:10px}
.filmmodal{position:fixed;inset:0;z-index:200;background:rgba(2,6,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:18px}
.filmmodal .filmwrap{max-width:760px;width:100%}
.filmmodal .filmlabel{max-width:760px;width:100%}
.filmmodal .card{max-width:760px;width:100%}
/* ===== TREATMENT RESPONSE ===== */
.txstrip{display:none;border-radius:4px;padding:8px 12px;font-weight:700;margin:8px 0}
.txstrip.show{display:block;background:#0a2e17;color:#7de2a0;border:1px solid #1d5c33}
.txlog{font-size:13px}
.txlog p{margin:4px 0}
/* ===== CHART LAYOUT: storyboard rail + main (Hyperspace pattern) ===== */
.chartlayout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:12px;align-items:start}
.chartmain{min-width:0}
.sb-rail{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
@media(min-width:901px){.sb-rail{position:sticky;top:118px}}
@media(max-width:900px){.chartlayout{grid-template-columns:1fr}.sb-rail{position:static}}
.sb-photo{width:64px;height:64px;border-radius:50%;background:var(--salt);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--navy);margin:12px auto 4px}
.sbname{text-align:center;font-weight:700;font-size:15px;color:var(--ink);padding:0 8px}
.sbsub{text-align:center;color:var(--mut);font-size:12.5px;padding:0 10px 8px}
.sbbanner{background:var(--warnbg);border-top:1px solid #d9a400;border-bottom:1px solid #d9a400;color:var(--warn);font-weight:700;font-size:12px;padding:5px 10px;text-align:center}
.sbrow{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-top:1px solid var(--line2);font-size:12.5px}
.sbrow .k{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;padding-top:1px;white-space:nowrap}
.sbrow .v{font-weight:600;text-align:right}
.sbsec{background:#e8eef5;border-top:1px solid var(--line);border-bottom:1px solid var(--line2);padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);margin-top:6px}
.sbstory{font-size:12.5px;color:var(--ink);padding:6px 10px 10px;margin:0}
.actnav button svg{vertical-align:-2px;margin-right:5px}
/* ===== SUMMARY WIDGET GRID ===== */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:12px}
.widget{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(23,35,58,.05)}
.widget .whead{background:#e8eef5;border-bottom:1px solid var(--line);padding:5px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
.widget .wbody{padding:8px 10px;font-size:13.5px}
.widget .wbody p{margin:4px 0}
.widget table{font-size:13px}
.widget table th,.widget table td{padding:4px 6px}
.widget ul{margin:4px 0;padding-left:18px}
.widget li{margin:3px 0}
/* ===== MY NOTE COMPOSER ===== */
.composer{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px;background:#fff}
.comphead{background:#e8eef5;border-bottom:1px solid var(--line);padding:6px 10px;font-weight:700;color:var(--navy);font-size:13.5px}
.comphead .compsub{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:1px}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--salt);border-bottom:1px solid var(--line2);padding:5px 8px}
.toolbar button{padding:2px 9px;font-size:13px;box-shadow:none}
.toolbar select{box-shadow:none}
.composer .cbody{padding:10px 12px}
.composer textarea{min-height:140px}
.compactions{margin:8px 0 2px}
</style></head><body>
<header><span class="hgroup"><span class="logo">+</span><span class="wordmark">Chart<span class="teal">Practice</span></span></span><span class="env"><span class="envrow"><span class="chip">TRAINING</span><span class="who"><b>You, RRT Student</b><br>Respiratory Therapy</span></span><span id="clock"></span></span></header><div class="envbanner">TRAINING ENVIRONMENT — practice EHR with fictional patients. Not for clinical use.</div>
<div class="hud" id="hud"><span id="hudTxt"></span><span><button class="btn small" id="hudQBtn" style="display:none" onclick="jumpToQuestion()">Answer end question</button> <button class="btn small warn" onclick="endRunManual()">End run</button></span></div>
<nav class="ws" id="ws">
<button data-w="lists" class="on">Patient Lists</button><button data-w="chart">Chart</button>
<button data-w="inbasket">In Basket <span id="unreadBadge"></span></button><button data-w="smart">SmartTools</button>

h+=censusHtml(units)+`</span><p><button class="btn" onclick="if(confirm('Reset to fresh seed charts? Your runs and drills reset too.')){S=seed();save();cur=1;render()}">Reset to seed</button></p></div>`;

function censusHtml(units){let h='';const f=listFilter.trim().toLowerCase();units.forEach(u=>{if(unitFilter&&u!==unitFilter)return;const rows=S.patients.filter(p=>p.unit===u&&(!f||(p.name+' '+p.dx+' '+p.unit+' '+p.room).toLowerCase().includes(f)));if(!rows.length)return;h+=`<div class="unitbar">${esc(u)} — ${rows.length} patient${rows.length===1?'':'s'}</div><div class="scroll"><table class="census"><tr><th>Room</th><th>Patient</th><th>Admitting diagnosis</th><th>Hospital day</th><th></th></tr>`;rows.forEach(p=>{h+=`<tr class="prow"><td class="roomcell"><span class="sdot"></span><b>${esc(p.room)}</b></td><td><a class="plink" onclick="openPt(${p.id})">${esc(p.name)}</a><br><span class="mut">${esc(p.mrn)} • ${p.age===0?'Newborn':p.age+' y/o'} ${esc(p.sex)} • practice patient</span><br>${esc(p.device)}</td><td>${esc(p.dx)}</td><td>Day ${p.day}</td><td><button class="btn small primary" onclick="openPt(${p.id})">Open chart</button></td></tr>`});h+=`</table></div>`});return h||'<p class="mut">No patients match that filter.</p>'}

function admit(){const name=prompt('Patient name (fictional)');if(!name||!name.trim())return;const id=Math.max(0,...S.patients.map(p=>p.id))+1;S.patients.push({id,name:name.trim(),mrn:'P-'+(1000+id),age:50,sex:'—',unit:'Med-Surg',room:'MS-NEW',dx:'New admission — RT evaluation (admitted '+todayLocal()+')',day:1,device:'To be assessed',story:'Newly admitted practice patient.',vitals:{HR:'—',BP:'—',RR:'—',SpO2:'—',Temp:'—'},abg:{type:'arterial',pH:7.40,PaCO2:40,HCO3:24,PaO2:80,SaO2:96},lda:[]});S.orders.push({id:Math.max(0,...S.orders.map(o=>o.id))+1,pid:id,text:'RT evaluation and treat',cat:'Respiratory Care',status:'Active'});save();render();setStatus('Admitted '+name.trim()+' ('+'P-'+(1000+id)+') on '+todayLocal())}

<script>
function drillStats(name){const d=S.drills.filter(x=>x.name===name);if(!d.length)return null;const secs=d.map(x=>x.sec);return{count:d.length,best:Math.min(...secs),last:d[d.length-1].sec,avg:Math.round(secs.reduce((a,b)=>a+b,0)/d.length)}}
function fmtSec(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerCard(){const st=drillStats(drill.name);return `<div class="card" id="trainerTimer"><h3>Training Timer — Drills</h3><p class="mut">Ten drills. Pause and resume keep your elapsed time; Finish &amp; save records the run. Best / average / last are kept per drill.</p><label>Drill</label><select id="drillName" onchange="drill.name=this.value;drill.sec=0;drill.run=false;clearInterval(drill.iv);render()">${DRILL_NAMES.map(n=>`<option${n===drill.name?' selected':''}>${esc(n)}</option>`).join('')}</select><p id="drillDisp" style="font-size:20px;font-weight:700;margin:4px 0">${fmtSec(drill.sec)} ${drill.run?'<span class="ok">● timing</span>':'<span class="mut">paused / not started</span>'}</p><button class="btn primary" onclick="drillToggle()">${drill.run?'Pause':'Start / Resume'}</button> <button class="btn" onclick="drillFinish()">Finish &amp; save</button> <button class="btn ghost" onclick="drill.sec=0;drill.run=false;clearInterval(drill.iv);render()">Reset</button>${st?`<p><b>${esc(drill.name)} history:</b> best ${fmtSec(st.best)} • avg ${fmtSec(st.avg)} • last ${fmtSec(st.last)} • ${st.count} run(s)</p>`:'<p class="mut">No saved runs for this drill yet.</p>'}<p class="mut">${S.drills.slice().reverse().slice(0,6).map(d=>`${esc(d.name)}: ${fmtSec(d.sec)} — ${esc(d.when)}`).join('<br>')}</p></div>`}
function drillToggle(){if(drill.run){drill.run=false;clearInterval(drill.iv)}else{drill.run=true;clearInterval(drill.iv);drill.iv=setInterval(()=>{drill.sec++;const d=$('#drillDisp');if(d)d.innerHTML=fmtSec(drill.sec)+' <span class="ok">● timing</span>'},1000)}render()}
function drillStartNamed(name){drill.name=name;ws='lists';$$('#ws button').forEach(x=>x.classList.toggle('on',x.dataset.w==='lists'));render();if(!drill.run)drillToggle();setStatus('Timing: '+name);scrollToId('trainerTimer')}
function drillFinish(){clearInterval(drill.iv);const was=drill.run;drill.run=false;if(drill.sec>0){S.drills.push({name:($('#drillName')?$('#drillName').value:drill.name),sec:drill.sec,when:nowStr()});drill.sec=0;save();setStatus('Drill saved')}render()}
const ACTS=[["summary","Summary"],["monitor","Live Monitor"],["story","Storyboard"],["flow","Flowsheets"],["mar","MAR"],["orders","Orders"],["notes","Notes"],["results","Results"],["lda","LDA"],["charges","Charges"],["imaging","Imaging"]];
const ACTICONS={summary:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',monitor:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',story:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',flow:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16M9 5v14M16 5v14"/></svg>',mar:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="7" rx="3.5"/><path d="M12 9v7"/></svg>',orders:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"/></svg>',notes:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>',results:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3h4M11 3v6l-5 9a2 2 0 0 0 1.8 3h8.4A2 2 0 0 0 18 18l-5-9V3"/></svg>',lda:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M12 17v4"/></svg>',charges:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.6"/></svg>',imaging:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x= function viewChart(){const p=P();const initials=p.name.split(' ').map(w=>w.charAt(0)).slice(0,2).join('').toUpperCase();const wtm=/Weight ([\d,]+ ?g)/.exec(p.story||'');const sbrow=(k,v)=>`<div class="sbrow"><span class="k">${k}</span><span class="v">${v}</span></div>`;let rail=`<aside class="sb-rail"><div class="sb-photo">${esc(initials)}</div><div class="sbname">${esc(p.name)}</div><div class="sbsub">${p.age===0?'Newborn':p.age+' y/o'} ${esc(p.sex)} • ${esc(p.unit)} ${esc(p.room)}</div><div class="sbbanner">Allergies: Not charted</div>`+sbrow('MRN',esc(p.mrn))+sbrow('Bed',esc(p.room))+sbrow('Unit',esc(p.unit))+sbrow('Service','Respiratory Therapy')+sbrow('Code status','—')+sbrow('Attending','—')+sbrow('Hospital day','Day '+p.day)+sbrow('Height','—')+sbrow('Weight',wtm?esc(wtm[1]):'—')+sbrow('Active orders',String(S.orders.filter(o=>o.pid===cur&&o.status==='Active').length))+sbrow('MAR due',String(dueMar(cur).length))+sbrow('Lines / drains',String((p.lda||[]).length))+`<div class="sbsec">Storyboard</div><p class="sbstory">${esc(p.story)}</p></aside>`;let h=`<div class="banner"><div class="bavatar">${esc(initials)}</div><div class="bmain"><div class="bname">${esc(p.name)}</div><div class="bfields"><span class="bfield"><span class="lbl">MRN</span>${esc(p.mrn)}</span><span class="bfield"><span class="lbl">Age / Sex</span>${p.age===0?'Newborn':p.age+' y/o'} ${esc(p.sex)}</span><span class="bfield"><span class="lbl">Loc</span>${esc(p.unit)} • ${esc(p.room)}</span><span class="bfield"><span class="lbl">Hospital day</span>${p.day}</span></div><div class="bdx"><b>${esc(p.dx)}</b> — ${esc(p.device)}</div><button class="btn small aiBtn" style="margin-top:7px" onclick="setWs('ai')">✦ Ask the AI Agent about this patient</button></div></div><div class="actnav">`;ACTS.forEach(a=>h+=`<button class="${act===a[0]?'on':''}" onclick="jumpAct('${a[0]}')">${ACTICONS[a[0]]||''}${a[1]}</button>`);h+=`</div>`;ACTS.forEach(a=>{h+=`<section class="actsec" id="actsec-${a[0]}"><div class="seclabel">${a[1]}</div><div id="actBody-${a[0]}"></div></section>`});return `<div class="chartlayout">${rail}<div class="chartmain">${h}</div></div>`}

function fillAct(b){const p=P();let h='';
if(act==='summary'){const due=dueMar(cur);const myMar=S.mar.filter(m=>m.pid===cur);const myOrders=S.orders.filter(o=>o.pid===cur);const myNotes=S.notes.filter(n=>n.pid===cur);const film=(typeof FILMS!=='undefined'&&FILMS[cur])?FILMS[cur]:null;const wtm=/Weight ([\d,]+ ?g)/.exec(p.story||'');const todo=[];due.forEach(m=>todo.push('Give '+m.med+' @ '+m.time));myNotes.filter(n=>n.status==='Draft').forEach(n=>todo.push('Sign draft: '+n.title));myOrders.filter(o=>o.status==='Active').slice(0,3).forEach(o=>todo.push('Complete order: '+o.text));if(!todo.length)todo.push('Nothing outstanding — chart the next scheduled check.');const W=(t,b)=>`<div class="widget"><div class="whead">${t}</div><div class="wbody">${b}</div></div>`;h='<div class="wgrid">'
+W('At a Glance',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px"><div><span class="mut">Due meds</span><br><span class="big">${due.length}</span></div><div><span class="mut">Active orders</span><br><span class="big">${myOrders.filter(o=>o.status==='Active').length}</span></div><div><span class="mut">Results</span><br><span class="big">${S.results.filter(r=>r.pid===cur).length+1}</span></div><div><span class="mut">Unsigned drafts</span><br><span class="big">${myNotes.filter(n=>n.status==='Draft').length}</span></div></div>`)
+W('Patient Summary',`<p>${esc(p.story)}</p><p><b>${esc(p.dx)}</b><br><span class="mut">Device:</span> ${esc(p.device)}</p><p>${timeThisBtn('Vent check')} ${timeThisBtn('Chart audit')}</p>`)
+W('Vitals',`<table><tr><th>HR</th><th>BP</th><th>RR</th><th>SpO₂</th><th>Temp</th></tr><tr><td>${esc(p.vitals.HR)}</td><td>${esc(p.vitals.BP)}</td><td>${esc(p.vitals.RR)}</td><td>${esc(p.vitals.SpO2)}%</td><td>${esc(p.vitals.Temp)}</td></tr></table><p><b>Gas quick read:</b> ${abgRead(p.abg)}</p>`)

+W('To-Do List',`<ul>${todo.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="mut">${due.length} due med(s) • ${myOrders.filter(o=>o.status==='Active').length} active order(s) • ${myNotes.filter(n=>n.status==='Draft').length} unsigned draft(s)</p>`)

if(act==='flow'){const rows=S.flows.filter(f=>f.pid===cur);const groups=["Ventilator","Vital Signs","Respiratory Assessment","Oxygen Therapy","Pulmonary Hygiene"];const latest={};rows.forEach(f=>latest[f.group]=f);h=`<div class="grid2"><div class="card"><h3>Flowsheet groups</h3>${groups.map(g=>`<p><b>${g}</b><br>${latest[g]?`<span class="mut">Latest:</span> ${esc(latest[g].val)}<br><span class="mut">${esc(latest[g].when)}</span>`:'<span class="mut">No column yet</span>'}</p>`).join('')}</div><div class="card"><h3>Flowsheets — file a column</h3><label>Group</label><select id="fGroup">${groups.map(g=>`<option>${g}</option>`).join('')}</select><label>Key value (e.g. PEEP 14, SpO₂ 91, VT 420)</label><input id="fVal" placeholder="Enter a value — blank filing is blocked"><button class="btn primary" onclick="fileFlow()">File column</button> ${timeThisBtn('Vent check')}<h4>Charted columns (newest first)</h4>${rows.length?`<div class="scroll"><table class="flowgrid"><tr><th>When</th><th>Group</th><th>Value</th><th></th></tr>${rows.slice().reverse().map((f,ri)=>`<tr${ri===0?' class="latest"':''}><td>${esc(f.when)}${ri===0?' <span class="tag">Latest</span>':''}</td><td><b>${esc(f.group)}</b></td><td>${esc(f.val)}</td><td><button class="btn small" onclick="delFlow(${f.id})">Delete</button></td></tr>`).join('')}</table></div>`:'<p class="mut">No columns charted yet for this patient.</p>'}</div></div>`}
if(act==='mar'){const times=[...new Set(S.mar.filter(m=>m.pid===cur).map(m=>m.time))].sort();h=`<div class="card"><h3>MAR — Time-column worklist</h3>${times.map(t=>`<h4>${esc(t)}</h4>`+S.mar.filter(m=>m.pid===cur&&m.time===t).map(m=>`<p><b>${esc(m.med)}</b> — ${m.status==='Due'?'<span class="bad">Due</span>':'<span class="ok">Given</span>'} ${m.status==='Due'?`<button class="btn small primary" onclick="giveMar(${m.id})">Mark Given</button>`:`<button class="btn small" onclick="resetMar(${m.id})">Reset to Due</button>`}</p>`).join('')).join('')||'<p class="mut">No MAR tasks for this patient.</p>'}<p>${timeThisBtn('Neb treatment')}</p></div>`}
if(act==='orders'){const cats=[...new Set(S.orders.filter(o=>o.pid===cur).map(o=>o.cat))];h=`<div class="card"><h3>Orders — grouped by category</h3><h4>New order — SmartPhrases work here too</h4><label>Order text / details — start typing a dot phrase (e.g. .o2check…) and pick it from the menu, or type the full phrase + space</label><input id="oText" class="phraseable" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. .o2check — or type the order in full"><label>Category</label><select id="oCat"><option>Respiratory Care</option><option>Medications</option><option>Diagnostics</option><option>Other</option></select><p><button class="btn primary" onclick="addOrder()">Add order</button></p>${cats.map(c=>`<h4>${esc(c)}</h4>`+S.orders.filter(o=>o.pid===cur&&o.cat===c).map(o=>`<p>${esc(o.text)} — <b>${esc(o.status)}</b> ${o.status==='Active'?`<button class="btn small primary" onclick="completeOrder(${o.id})">Complete</button>`:`<button class="btn small" onclick="reactivateOrder(${o.id})">Reactivate</button>`}</p>`).join('')).join('')||'<p class="mut">No orders for this patient.</p>'}</div>`}
b.innerHTML=h;if(['notes','results','lda','charges'].includes(act))fillAct2(b)}
function saveVitals(){const p=P();p.vitals={HR:$('#vHR').value.trim()||p.vitals.HR,BP:$('#vBP').value.trim()||p.vitals.BP,RR:$('#vRR').value.trim()||p.vitals.RR,SpO2:$('#vSpO2').value.trim()||p.vitals.SpO2,Temp:$('#vTemp').value.trim()||p.vitals.Temp};save();render();setStatus('Vitals saved for '+p.name)}
function fileFlow(){const v=$('#fVal').value.trim();if(!v){alert('Chart at least one value — blank flowsheet filing is blocked.');return}S.flows.push({id:Date.now(),pid:cur,group:$('#fGroup').value,val:v,when:nowStr()});save();noteTask('flow');const fg=$('#fGroup').value;if(fg==='Ventilator'&&/fio|peep/i.test(v))logTreatment('fio2',cur,'Vent change: '+v);if(fg==='Pulmonary Hygiene'&&/suction/i.test(v))logTreatment('suction',cur,'Suctioning: '+v);render();setStatus('Flowsheet column filed')}
function delFlow(id){S.flows=S.flows.filter(x=>x.id!==id);save();render()}
function giveMar(id){const m=S.mar.find(x=>x.id===id);if(!m||m.status!=='Due')return;m.status='Given';save();noteTask('mar');const txk=txClassifyMed(m.med);if(txk)logTreatment(txk,cur,m.med);render();setStatus('MAR given: '+m.med)}
function resetMar(id){const m=S.mar.find(x=>x.id===id);if(!m)return;m.status='Due';save();render()}
function completeOrder(id){const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='Active')return;o.status='Complete';save();noteTask('order');render()}
function reactivateOrder(id){const o=S.orders.find(x=>x.id===id);if(!o)return;o.status='Active';save();render()}
function addOrder(){const t=(($('#oText')||{}).value||'').trim();if(!t){alert('Write the order text first — blank orders are blocked.');return}S.orders.push({id:Date.now(),pid:cur,text:t,cat:($('#oCat')||{}).value||'Respiratory Care',status:'Active'});save();render();setStatus('Order added for '+P().name+': '+t)}
</script>
<script>
function fillAct2(b){const p=P();let h='';
if(act==='notes'){const ed=editNoteId?S.notes.find(n=>n.id===editNoteId&&n.pid===cur&&n.status==='Draft'):null;const stKeys=Object.keys(allPhrases());h=`<div class="card"><h3>Notes</h3><div class="composer"><div class="comphead">My Note — ${esc(p.name)}<span class="compsub">Respiratory Therapy • ${todayLocal()} • Pend saves a draft — Sign locks the note; corrections go in an addendum</span></div><div class="toolbar"><button type="button" onclick="fmtWrap('**')" title="Bold"><b>B</b></button><button type="button" onclick="fmtWrap('*')" title="Italic"><i>I</i></button><button type="button" onclick="fmtWrap('__')" title="Underline"><u>U</u></button><select id="nFontSize" style="width:auto;margin:0" onchange="document.getElementById('nBody').style.fontSize=this.value"><option value="">Text size</option><option value="13px">Small</option><option value="14px">Normal</option><option value="16px">Large</option></select><button type="button" onclick="toggleStMenu()">Insert SmartText</button><span class="mut">Dot phrases also expand as you type — start with a dot, e.g. .vent…</span></div><div id="stMenu" style="display:none;border-bottom:1px solid var(--line2);padding:6px 8px">${stKeys.map(k=>`<button type="button" class="btn small" style="margin:2px" onclick="insertPhraseKey('${esc(k)}')">${esc(k)}</button>`).join('')}</div><div class="cbody"><label>Title</label><input id="nTitle" value="${ed?esc(ed.title):'RT Progress Note'}"><label>Body — @NAME@, @DEVICE@ and other tokens fill from this chart; the first *** is left selected so you can type straight over it.</label><textarea id="nBody" class="phraseable" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Start typing a dot phrase — e.g. .vent…">${ed?esc(ed.body):''}</textarea><div class="linkrow"><span class="mut">SmartLinks — click to insert:</span>${SMARTLINKS.map((l,i)=>`<select id="sl${i}" style="width:auto;margin:0">${l.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select><button class="btn small" onclick="insertLink(${i})">${esc(l.name)}</button>`).join('')}</div><p class="compactions"><button class="btn" onclick="saveNote('Draft')">Pend</button> <button class="btn primary" onclick="saveNote('Signed')">Sign</button> <button class="btn ghost" onclick="editNoteId=null;render()">Cancel</button> ${timeThisBtn('Chart audit')}</p><p class="mut">Signing saves what is in the editor first. Signed notes cannot be edited, re-signed or deleted — corrections go in an addendum.</p></div></div>${S.notes.filter(n=>n.pid===cur).slice().reverse().map(n=>`<div class="card"><b>${esc(n.title)}</b> — ${esc(n.status)}<p>${esc(n.body)}</p>${n.status==='Draft'?`<button class="btn small" onclick="editNote(${n.id})">Edit</button> <button class="btn small primary" onclick="signNote(${n.id})">Sign</button> <button class="btn small" onclick="delNote(${n.id})">Delete</button>`:`<span class="ok">Signed — locked</span> <button class="btn small" onclick="addendum(${n.id})">Add addendum</button>`}</div>`).join('')||'<p class="mut">No notes yet for this patient.</p>'}</div>`}

if(act==='results'){h=`<div class="card"><h3>Results — seed gas + filed results</h3><p><b>${esc(p.abg.type)} gas:</b> pH ${p.abg.pH}, PaCO₂ ${p.abg.PaCO2}, HCO₃ ${p.abg.HCO3}, PaO₂ ${p.abg.PaO2}, SaO₂ ${p.abg.SaO2}%</p><p>${abgRead(p.abg)}</p><h4>File a result (each panel files only its own analytes)</h4><label>Panel</label><select id="rPanel" onchange="panelFields()">${Object.keys(PANELS).map(k=>`<option>${k}</option>`).join('')}</select><div id="rFields"></div><label>Comment (optional) — SmartPhrases work here too: start typing a dot phrase, e.g. .abg…</label><textarea id="rComment" class="phraseable" autocomplete="off" autocapitalize="off" spellcheck="false" style="min-height:56px" placeholder="Result comment…"></textarea><button class="btn primary" onclick="fileResult()">File result</button> ${timeThisBtn('ABG draw')}${S.results.filter(r=>r.pid===cur).slice().reverse().map(r=>`<p><b>${esc(r.panel)}</b>: ${esc(r.vals)} <span class="mut">${esc(r.when)}</span></p>`).join('')}</div>`}
if(act==='lda'){const removed=(S.ldaRemoved&&S.ldaRemoved[cur])||[];h=`<div class="card"><h3>LDA — Lines / Drains / Airways</h3>${p.lda.map((l,i)=>`<p>• ${esc(l)} <button class="btn small" onclick="removeLda(${i})">Remove</button></p>`).join('')||'<p class="mut">No active LDAs.</p>'}${removed.length?`<h4>Removed — can be reactivated</h4>${removed.map((l,i)=>`<p class="mut">• ${esc(l)} <button class="btn small" onclick="reactivateLda(${i})">Reactivate</button></p>`).join('')}`:''}<label>Add LDA</label><input id="ldaNew" placeholder="e.g. ETT 7.5 @ 22 cm"><button class="btn primary" onclick="addLda()">Add</button></div>`}
if(act==='charges'){h=`<div class="card"><h3>Charge Capture — CPT catalog</h3>${CPTS.map(c=>`<p><b>${c[0]}</b> — ${esc(c[1])} <button class="btn small primary" onclick="addCharge('${c[0]}')">Capture</button></p>`).join('')}<h4>Captured for this patient</h4>${S.charges.filter(c=>c.pid===cur).slice().reverse().map(c=>`<p>${esc(c.code)} <span class="mut">${esc(c.when)}</span></p>`).join('')||'<p class="mut">None yet.</p>'}</div>`}
b.innerHTML=h;if(act==='results')panelFields()}
function insertLink(i){const sel=$('#sl'+i),ta=$('#nBody');if(!sel||!ta)return;const txt=SMARTLINKS[i].name+': '+sel.value+'. ';const s=(ta.selectionStart==null?ta.value.length:ta.selectionStart),e=(ta.selectionEnd==null?s:ta.selectionEnd);ta.value=ta.value.slice(0,s)+txt+ta.value.slice(e);ta.focus();const c=s+txt.length;try{ta.setSelectionRange(c,c)}catch(err){}hidePhraseMenu()}
function fmtWrap(mk){const ta=$('#nBody');if(!ta)return;const s=ta.selectionStart||0,e=ta.selectionEnd||0;const sel=ta.value.slice(s,e)||'text';ta.value=ta.value.slice(0,s)+mk+sel+mk+ta.value.slice(e);ta.focus();try{ta.setSelectionRange(s+mk.length,s+mk.length+sel.length)}catch(err){}}
function toggleStMenu(){const m=$('#stMenu');if(m)m.style.display=m.style.display==='none'?'block':'none'}
function insertPhraseKey(k){const ta=$('#nBody');if(!ta||!allPhrases()[k])return;const text=fillTokens(allPhrases()[k]);const s=(ta.selectionStart==null?ta.value.length:ta.selectionStart),e=(ta.selectionEnd==null?s:ta.selectionEnd);ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);const m2=$('#stMenu');if(m2)m2.style.display='none';ta.focus();const star=text.indexOf('***');if(star>=0){try{ta.setSelectionRange(s+star,s+star+3)}catch(err){}}else{try{ta.setSelectionRange(s+text.length,s+text.length)}catch(err){}}}
/* ===== SMARTPHRASES: caret menu + phrase+Space expansion =====
   Active in every .phraseable field (note body, new-order text, result
   comment, In Basket reply). Typing part of a dot phrase opens a menu at
   the caret; picking it, pressing Enter/Tab, or typing the full phrase +
   Space expands it with @TOKENS@ filled from the open chart and the
   first *** wildcard left selected. */
let PM={el:null,matches:[],idx:0,frag:null};
function phraseKeyFor(frag){if(!frag)return null;const f=frag.toLowerCase();const all=allPhrases();for(const k of Object.keys(all))if(k.toLowerCase()===f)return k;return null}
function phraseFragment(el){const pos=el.selectionStart;if(pos==null)return null;const upto=el.value.slice(0,pos);const m=/(\.[A-Za-z0-9_]*)$/.exec(upto);if(!m||m[1].length<2)return null;const start=pos-m[1].length;if(start>0&&!/[\s(\[{]/.test(el.value.charAt(start-1)))return null;return{frag:m[1],start:start,end:pos}}
function pmMenuEl(){let m=document.getElementById('phraseMenu');if(!m){m=document.createElement('div');m.id='phraseMenu';m.className='phrasemenu';m.style.display='none';document.body.appendChild(m)}return m}
function hidePhraseMenu(){const m=document.getElementById?document.getElementById('phraseMenu'):null;if(m)m.style.display='none';PM.el=null;PM.matches=[];PM.frag=null}
function caretCoords(el){try{const cs=window.getComputedStyle(el);const div=document.createElement('div');['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderLeftWidth'].forEach(function(p){div.style[p]=cs[p]});div.style.position='absolute';div.style.visibility='hidden';div.style.whiteSpace='pre-wrap';div.style.wordWrap='break-word';div.style.overflowWrap='break-word';div.style.width=Math.max(60,(el.clientWidth||el.offsetWidth||280))+'px';div.textContent=el.value.slice(0,el.selectionStart);const sp=document.createElement('span');sp.textContent='\u200b';div.appendChild(sp);document.body.appendChild(div);const r=el.getBoundingClientRect();const lh=parseFloat(cs.lineHeight)||20;const out={top:r.top-(el.scrollTop||0)+sp.offsetTop+lh+4,left:r.left-(el.scrollLeft||0)+sp.offsetLeft};document.body.removeChild(div);return out}catch(e){const r=el.getBoundingClientRect();return{top:r.bottom+4,left:r.left}}}
function showPhraseMenu(el,fr,matches){const m=pmMenuEl();PM.el=el;PM.matches=matches;PM.idx=0;PM.frag=fr;const all=allPhrases();m.innerHTML='<div class="pmhint">SmartPhrases — tap, or arrow keys + Enter</div>'+matches.map(function(k,i){return '<button type="button" data-pm="'+i+'" class="'+(i===0?'hl':'')+'"><span class="pmkey">'+esc(k)+'</span> <span class="pmprev">'+esc(all[k].slice(0,60))+'</span></button>'}).join('');m.querySelectorAll('button[data-pm]').forEach(function(b){b.addEventListener('mousedown',function(ev){ev.preventDefault();pickPhrase(parseInt(b.getAttribute('data-pm'),10))})});const c=caretCoords(el);m.style.display='block';const mw=m.offsetWidth||320;let left=c.left;if(left+mw>window.innerWidth-8)left=Math.max(8,window.innerWidth-mw-8);m.style.left=left+'px';let top=c.top;if(top+190>window.innerHeight)top=Math.max(8,c.top-210);m.style.top=top+'px'}
function paintPmHl(){const m=document.getElementById?document.getElementById('phraseMenu'):null;if(!m)return;m.querySelectorAll('button[data-pm]').forEach(function(b,i){b.classList.toggle('hl',i===PM.idx)})}
function expandPhraseKey(el,key,start,end,addSpace){const text=fillTokens(allPhrases()[key]);const ins=text+(addSpace?' ':'');el.value=el.value.slice(0,start)+ins+el.value.slice(end);try{el.focus()}catch(e){}const star=text.indexOf('***');if(star>=0){try{el.setSelectionRange(start+star,start+star+3)}catch(e){}}else{const c=start+ins.length;try{el.setSelectionRange(c,c)}catch(e){}}hidePhraseMenu();setStatus('SmartPhrase expanded: '+key)}
function pickPhrase(i){const el=PM.el,key=PM.matches[i],fr=PM.frag;if(!el||!key||!fr)return;expandPhraseKey(el,key,fr.start,fr.end,false)}
function handlePhraseInput(el){if(!el||!el.classList||!el.classList.contains('phraseable'))return;const pos=el.selectionStart;if(pos==null)return;if(pos>0&&el.value.charAt(pos-1)===' '){const before=el.value.slice(0,pos-1);const m=/(\.[A-Za-z0-9_]+)$/.exec(before);if(m){const key=phraseKeyFor(m[1]);if(key){expandPhraseKey(el,key,pos-1-m[1].length,pos,true);return}}}
 const fr=phraseFragment(el);if(!fr){hidePhraseMenu();return}const f=fr.frag.toLowerCase();const matches=Object.keys(allPhrases()).filter(function(k){return k.toLowerCase().indexOf(f)===0}).slice(0,8);if(!matches.length){hidePhraseMenu();return}showPhraseMenu(el,fr,matches)}
function expandPhrase(el){if(el&&el.classList&&el.classList.contains&&el.classList.contains('phraseable')&&el.selectionStart!=null){handlePhraseInput(el);return}if(!el||typeof el.value!=='string')return;const all=allPhrases();const lv=el.value.toLowerCase();for(const k of Object.keys(all)){const needle=(k+' ').toLowerCase();const i=lv.indexOf(needle);if(i>=0){el.value=el.value.slice(0,i)+fillTokens(all[k])+' '+el.value.slice(i+needle.length);return}}}
if(document.addEventListener){document.addEventListener('input',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('phraseable'))handlePhraseInput(e.target)});document.addEventListener('keydown',function(e){const m=document.getElementById?document.getElementById('phraseMenu'):null;if(!m||m.style.display==='none'||!PM.el||e.target!==PM.el)return;if(e.key==='ArrowDown'){e.preventDefault();PM.idx=Math.min(PM.matches.length-1,PM.idx+1);paintPmHl()}else if(e.key==='ArrowUp'){e.preventDefault();PM.idx=Math.max(0,PM.idx-1);paintPmHl()}else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickPhrase(PM.idx)}else if(e.key==='Escape'){hidePhraseMenu()}});document.addEventListener('mousedown',function(e){const m=document.getElementById?document.getElementById('phraseMenu'):null;if(m&&m.style.display!=='none'&&!m.contains(e.target)&&e.target!==PM.el)hidePhraseMenu()})}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('resize',function(){hidePhraseMenu()});
function saveNote(st){const body=($('#nBody').value||'').trim();if(!body){alert('Write the note first — blank notes are blocked.');return}const title=($('#nTitle').value||'').trim()||'RT Note';if(editNoteId){const n=S.notes.find(x=>x.id===editNoteId);if(n&&n.status==='Signed'){alert('Signed notes are locked — corrections go in an addendum');editNoteId=null;render();return}if(n){n.title=title;n.body=body;n.status=st;if(/suction/i.test(body))logTreatment('suction',cur,'Suctioning charted in note');if(st==='Signed'){editNoteId=null;save();noteTask('note');render();setStatus('Note saved & signed');return}editNoteId=null;save();render();setStatus('Draft saved');return}}S.notes.push({id:Date.now(),pid:cur,title,body,status:st});if(/suction/i.test(body))logTreatment('suction',cur,'Suctioning charted in note');save();if(st==='Signed')noteTask('note');render();setStatus(st==='Signed'?'Note saved & signed':'Draft saved')}
function editNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;if(n.status==='Signed'){alert('Signed notes are locked — corrections go in an addendum');return}editNoteId=id;render();scrollToId('actsec-notes');setStatus('Editing draft — Sign will save these edits first')}
function signNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;if(n.status==='Signed'){alert('Note is already signed');return}if(editNoteId===id){saveNote('Signed');return}n.status='Signed';save();noteTask('note');render();setStatus('Note signed')}
function delNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;if(n.status==='Signed'){alert('Signed notes are locked — corrections go in an addendum');return}S.notes=S.notes.filter(x=>x.id!==id);if(editNoteId===id)editNoteId=null;save();render()}
function addendum(id){const txt=prompt('Addendum text (creates a new signed addendum note)');if(!txt||!txt.trim())return;S.notes.push({id:Date.now(),pid:cur,title:'Addendum',body:txt.trim(),status:'Signed'});save();noteTask('note');render()}
function panelFields(){const sel=$('#rPanel'),wrap=$('#rFields');if(!sel||!wrap)return;if(!PANELS[sel.value])sel.value=Object.keys(PANELS)[0];wrap.innerHTML=PANELS[sel.value].map(f=>`<label>${f}</label><input data-rf="${f}">`).join('')}
function fileResult(){const vals=$$('[data-rf]').filter(i=>i.value.trim()).map(i=>i.dataset.rf+' '+i.value.trim()).join(', ');if(!vals){alert('Enter at least one value — blank result filing is blocked.');return}const cm=(($('#rComment')||{}).value||'').trim();S.results.push({id:Date.now(),pid:cur,panel:$('#rPanel').value,vals:cm?vals+' — Comment: '+cm:vals,when:nowStr()});save();noteTask('result');render();setStatus('Result filed')}
function removeLda(i){const p=P();const removedItem=p.lda.splice(i,1)[0];if(removedItem!==undefined){if(!S.ldaRemoved)S.ldaRemoved={};if(!S.ldaRemoved[cur])S.ldaRemoved[cur]=[];S.ldaRemoved[cur].push(removedItem)}save();render()}
function reactivateLda(i){const list=(S.ldaRemoved&&S.ldaRemoved[cur])||[];const item=list.splice(i,1)[0];if(item!==undefined)P().lda.push(item);save();render()}
function addLda(){const v=($('#ldaNew').value||'').trim();if(!v)return;P().lda.push(v);save();render()}
function addCharge(code){S.charges.push({pid:cur,code,when:nowStr()});save();noteTask('charge');render();setStatus('Charge captured: '+code)}
</script>
<script>
function viewInb(){const folders=["Results","Orders","Cosign","Patient Calls","Staff"];let h=`<div class="card"><h2>In Basket</h2><p class="mut">${unread()} unread of ${S.inb.length} messages.</p>`;folders.forEach(f=>{const ms=S.inb.filter(m=>m.folder===f);if(!ms.length)return;h+=`<h4>${esc(f)} (${ms.filter(m=>!m.read).length} unread)</h4>`+ms.map(m=>`<p class="${m.read?'':'msg-unread'}">${m.read?'':'<span class="dot">● </span>'}<span class="tag">${esc(m.folder)}</span> ${esc(m.subject)} ${m.read?'':`<button class="btn small" onclick="markRead(${m.id})">Mark read</button>`} <button class="btn small" onclick="replyMsg(${m.id})">Reply</button></p>${replyTo===m.id?replyComposer(m):''}`).join('')});return h+'</div>'}
function markRead(id){const m=S.inb.find(x=>x.id===id);if(m)m.read=true;save();render()}
function replyComposer(m){const prior=(S.replies||[]).filter(r=>r.mid===m.id);let h='<div class="card" style="border-top:3px solid var(--blue)"><h4>Reply — '+esc(m.subject)+'</h4>';if(prior.length)h+=prior.map(r=>'<p><b>You replied</b> <span class="mut">'+esc(r.when)+'</span><br>'+esc(r.body)+'</p>').join('');h+='<label>Reply text — SmartPhrases work here too: start typing a dot phrase, e.g. .handoff…</label><textarea id="replyBody" class="phraseable" autocomplete="off" autocapitalize="off" spellcheck="false" style="min-height:64px" placeholder="Type your reply — .handoff expands here too…"></textarea><p><button class="btn primary" onclick="sendReply()">Send reply</button> <button class="btn ghost" onclick="replyTo=null;render()">Cancel</button></p></div>';return h}
function replyMsg(id){const m=S.inb.find(x=>x.id===id);if(!m)return;if(!m.read)m.read=true;replyTo=(replyTo===id?null:id);save();render();if(replyTo===id){scrollToId('ws-inbasket');const ta=$('#replyBody');if(ta)ta.focus();setStatus('Replying to: '+m.subject)}}
function sendReply(){const body=(($('#replyBody')||{}).value||'').trim();if(!body){alert('Write the reply first — blank replies are blocked.');return}if(!Array.isArray(S.replies))S.replies=[];const m=S.inb.find(x=>x.id===replyTo);S.replies.push({id:Date.now(),mid:replyTo,subject:m?m.subject:'',body:body,when:nowStr()});replyTo=null;save();render();setStatus('Reply sent (practice) and saved — '+(m?m.subject:''))}
function viewSmart(){const all=allPhrases();const custom=Object.keys(S.extraPhrases||{});let h=`<div class="card"><h2>SmartTools</h2><p class="mut">17 built-in RT dot phrases${custom.length?' + '+custom.length+' of your own':''}. Start typing a phrase inside a Note, a new Order, a Result comment or an In Basket reply — a menu appears at the cursor; tap a phrase, use the arrow keys + Enter, or type the full phrase + space to expand it instantly. *** = wildcard to complete (left selected after expansion). Tokens @NAME@ @MRN@ @AGE@ @UNIT@ @ROOM@ @DX@ @DEVICE@ @SPO2@ @HR@ fill from the open chart.</p>`;Object.keys(all).forEach(k=>{h+=`<details class="phrase" open><summary>${esc(k)}${custom.includes(k)?' — yours':''}</summary><p>${esc(all[k])}</p>${custom.includes(k)?`<button class="btn small" onclick="delPhrase('${esc(k)}')">Delete my phrase</button>`:''}</details>`});h+=`<h3>SmartLinks — pick-lists (also in the Notes editor)</h3>${SMARTLINKS.map(l=>`<p><b>${esc(l.name)}</b> <span class="mut">${esc(l.key)}</span><br>${l.options.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</p>`).join('')}<h3>Add your own phrase</h3><label>Key (start with a dot)</label><input id="spKey" placeholder=".myphrase"><label>Text — use *** wildcards and @TOKEN@ tokens</label><textarea id="spVal" placeholder="Phrase text"></textarea><button class="btn primary" onclick="savePhrase()">Save phrase</button></div>`;return h}

<script>

let MON=null, monAudio=null;
function numOr(v,d){const n=parseFloat(v);return isNaN(n)?d:n}
function monBaseFor(p){
  const hr=numOr(p.vitals&&p.vitals.HR,82), rr=numOr(p.vitals&&p.vitals.RR,18),
        spo2=numOr(p.vitals&&p.vitals.SpO2,96), temp=numOr(p.vitals&&p.vitals.Temp,37.0);
  const bpm=/(\d+)\s*\/\s*(\d+)/.exec(String((p.vitals&&p.vitals.BP)||''));

  const vent=/ventilator/i.test(dev), bipap=/bipap/i.test(dev), cpap=/cpap/i.test(dev);
  const art=/arterial line/i.test(lda);
  let fio2=null; const fm=/FiO.\s*([0-9]*\.?[0-9]+)/i.exec(dev); if(fm)fio2=parseFloat(fm[1]);
  if(p.id===5)fio2=1.00; if(p.id===6)fio2=1.00;
  const etco2=(vent||bipap||cpap)?Math.max(18,Math.round(numOr(p.abg&&p.abg.PaCO2,40)-(p.id===5?8:5))):null;
  const neo=p.age===0;

    HR:[neo?100:50, neo?170:(hr>110?130:120)],
    RR:[neo?30:8, neo?70:(rr>=28?36:30)],
    SpO2:[neo?88:(tgtLo-3),100],
    SYS:[neo?45:90, neo?100:(sys>150?185:180)],
    EtCO2:etco2?[Math.max(15,etco2-15),etco2+10]:null
  };
  return {HR:hr,RR:rr,SpO2:spo2,Temp:temp,SYS:sys,DIA:dia,MAP:Math.round(dia+(sys-dia)/3),

}
function monReset(pid){

function monFmt(n,d){return (d===0)?String(Math.round(n)):n.toFixed(d)}
function monitorHtml(p){

  h+=tile('cSpO2',p.id===6?'SpO₂ — pulse ox ⚠ see note':'SpO₂ — pulse oximetry','SpO2',Math.round(c.SpO2),'% • target '+b.tgtLo+'–'+b.tgtHi+'%','low '+b.lim.SpO2[0]);
  h+=tile('cRR','RESP — Resp Rate','RR',Math.round(c.RR),'breaths/min',b.lim.RR[0]+' – '+b.lim.RR[1]);
  h+=tile('cBP',bpLab,'BP',bpTxt,(b.art?'mmHg • MAP ':'mmHg • MAP ')+'<span id="mon-MAP">'+(b.art?Math.round(c.DIA+(c.SYS-c.DIA)/3):MON.nibp.map)+'</span>',b.lim.SYS[0]+' – '+b.lim.SYS[1]+' sys');
  h+=tile('cTemp','TEMP','Temp',c.Temp.toFixed(1),'°C','—');
  h+=b.etco2?tile('cEtCO2','EtCO₂ — capnography','EtCO2',Math.round(c.EtCO2),'mmHg • PaCO₂ '+p.abg.PaCO2+' on gas',b.lim.EtCO2[0]+' – '+b.lim.EtCO2[1]):`<div class="mtile"><div class="mlab cEtCO2">EtCO₂ — capnography</div><div class="mv" style="color:#5a6d7f">—</div><div class="mun">No capnography on this device</div><div class="mlim">Vent / BiPAP / CPAP patients only</div></div>`;
  h+=`</div>`;
  h+=`<div class="monmeta" id="monCycle">${b.art?'Arterial line transduced continuously — BP updates with every beat.':'NIBP cuff cycles automatically (training cycle ≈ 45 s). Next cycle: <b id="monNibpIn">—</b>'}</div>`;
  h+=`<div class="monbtns"><button class="btn primary" onclick="captureVitals()">Capture vitals to Flowsheets</button><button class="btn warnb2" onclick="monSilence()">Silence alarms (2 min)</button><button class="btn" onclick="monAck()">✓ Acknowledge alarms</button><button class="btn" id="monSoundBtn" onclick="monSound()">QRS sound: OFF</button></div>`;
  h+=`<div class="monmeta">Trend — this session (HR green • SpO₂ cyan) &nbsp;<span id="monTrendTxt"></span></div><canvas class="trend" id="monTrend" width="920" height="92"></canvas>`;
  h+=`<h4 style="color:#cfe8d8;margin:12px 0 4px">Treatment log — charted treatments and their monitor response</h4><div class="txlog" id="monTxLog">${txLogHtml(p.id)}</div>`;

  if(p.id===5)h+=`<div class="trapnote">⚠ <b>Kowalski — severe ARDS:</b> SpO₂ ${Math.round(b.SpO2)}% on FiO₂ 1.00 with PEEP ${b.peep||14} is the charted picture (P/F 82). The monitor mean-reverts to those baselines — a low-80s/high-80s saturation here is the patient, not a probe error. Check plateau &amp; driving pressure on every vent check.</div>`;

  h+=`</div>`;
  h+=`<div class="card"><h3>How this monitor ties into the chart</h3><p>Numbers drift in real time around <b>this patient's own seeded vitals</b> — the same values on the Storyboard and the seed blood gas. Waveforms are rate-matched: ECG and pleth run at the charted heart rate, the respiratory trace at the charted rate${b.art?', and the red arterial trace exists because this patient has an arterial line on the LDA activity':''}.</p><p><b>Capture vitals to Flowsheets</b> files the monitor's current numbers as a new Vital Signs flowsheet column <i>and</i> refreshes the Storyboard snapshot — exactly how device data lands in a real Epic chart. Capturing also counts as the flowsheet step in a timed challenge for this patient.</p><p><b>Treatments move the monitor:</b> giving albuterol, furosemide or beractant on the MAR, charting suctioning, or filing a FiO₂/PEEP vent change makes these numbers respond over minutes — albuterol peaks in heart rate at about 4 minutes, furosemide works gradually over 15–30 minutes, beractant lifts SpO₂ and lowers the FiO₂ the patient needs. Watch the green “Responding to treatment” strip, the gold markers on the trend, and the treatment log below it. Effects fade back to baseline.</p><p>Occasional brief events — a cough, a mucus plug, extra effort — push one value across its alarm limit: the tile and banner flash red. <b>Silence</b> mutes alarms for 2 minutes; <b>Acknowledge</b> latches that alarm off until the value returns to range and re-arms.</p><p class="mut">Training simulation: values are generated on this device for practice and are not connected to any real monitor or patient.</p><p>${timeThisBtn('Vent check')} ${timeThisBtn('O₂ setup')}</p></div>`;
  return h;
}
function monDrift(key,noise,lo,hi,pull){const c=MON.cur,b=MON.base;c[key]+=(b[key]-c[key])*(pull||0.06)+(Math.random()-0.5)*2*noise;if(c[key]<lo)c[key]=lo;if(c[key]>hi)c[key]=hi}
function monBreaches(){
  if(!MON)return[];const c=MON.disp||MON.cur,L=MON.base.lim,out=[];
  const chk=(k,v,lo,hi,lab)=>{if(v<lo)out.push({k,msg:'*** '+lab+' '+Math.round(v)+' — BELOW low alarm '+lo});else if(v>hi)out.push({k,msg:'*** '+lab+' '+Math.round(v)+' — ABOVE high alarm '+hi})};

  if(c.SpO2<L.SpO2[0])out.push({k:'SpO2',msg:'*** SpO₂ '+Math.round(c.SpO2)+'% — BELOW low alarm '+L.SpO2[0]+'%'});

}
function monTick(){

function monBreachesRaw(){const save=MON.ack;MON.ack={};const r=monBreaches();MON.ack=save;return r}
function setTxt(id,v){const e=document.querySelector('#'+id);if(e)e.textContent=v}

function monSilence(){if(!MON)monReset(P().id);MON.silencedUntil=Date.now()+120000;monPaint(Date.now());setStatus('Monitor alarms silenced for 2 minutes')}

function monSound(){if(!MON)monReset(P().id);MON.sound=!MON.sound;

function gss(x,c,w){const d=(x-c)/w;return Math.exp(-d*d)}

function artVal(ph){ph=((ph%1)+1)%1;return ph<0.09?(ph/0.09):Math.exp(-(ph-0.09)*4.2)+0.22*gss(ph,0.32,0.045)}

function drawWave(){

  ctx.strokeStyle='rgba(70,110,90,.18)';ctx.lineWidth=1;ctx.beginPath();
  for(let gx=0;gx<W;gx+=23){ctx.moveTo(gx,0);ctx.lineTo(gx,H)} for(let gy=0;gy<H;gy+=23){ctx.moveTo(0,gy);ctx.lineTo(W,gy)} ctx.stroke();

              ['SpO₂ pleth',null,'#37c8ff',54,t=>plethVal((t*c.HR/60-0.22)%1)],
              ['RESP',null,'#ffd83d',54,t=>respVal((t*c.RR/60)%1)]];

  else if(b.etco2)rows.push(['EtCO₂ capno',null,'#ff9f2e',54,t=>capVal((t*c.RR/60)%1)]);

    ctx.strokeStyle=r[2];ctx.lineWidth=2;ctx.beginPath();

    ctx.stroke();ctx.fillStyle=r[2];ctx.font='bold 12px Consolas,monospace';ctx.fillText(r[0],8,i*rh+16);
    ctx.fillStyle='rgba(160,190,205,.75)';ctx.font='11px Consolas,monospace';
    const rv=r[0].indexOf('ECG')>0?Math.round(c.HR)+' bpm':r[0].indexOf('pleth')>0?Math.round(c.SpO2)+' %':r[0].indexOf('RESP')===0?Math.round(c.RR)+' /min':b.art?Math.round(c.SYS)+'/'+Math.round(c.DIA):Math.round(c.EtCO2||0)+' mmHg';
    ctx.fillText(rv,W-86,i*rh+16);});

  else if(beat!==MON.lastBeat)MON.lastBeat=beat;
}
function drawTrend(){

  const ctx=cv.getContext('2d'); if(!ctx)return; const W=cv.width,H=cv.height;

}

function txClassifyMed(med){const m=(med||'').toLowerCase();if(m.indexOf('albuterol')>=0)return'albuterol';if(m.indexOf('furosemide')>=0)return'furosemide';if(m.indexOf('beractant')>=0)return'beractant';return null}
function txOffsets(pid){const out={HR:0,RR:0,SpO2:0,fio2:0};const now=Date.now();(S.txLog||[]).forEach(function(e){if(e.pid!==pid)return;const d=TXDEF[e.kind];if(!d)return;const env=txEnv((now-e.start)/1000,d.peak,d.total);if(env<=0)return;out.HR+=d.HR*env;out.RR+=d.RR*env;out.SpO2+=d.SpO2*env;out.fio2+=d.fio2*env});out.HR=Math.max(-15,Math.min(15,out.HR));out.RR=Math.max(-8,Math.min(8,out.RR));out.SpO2=Math.max(-8,Math.min(6,out.SpO2));out.fio2=Math.max(-0.10,Math.min(0,out.fio2));return out}
function txActive(pid){const now=Date.now();return (S.txLog||[]).filter(function(e){return e.pid===pid&&TXDEF[e.kind]&&txEnv((now-e.start)/1000,TXDEF[e.kind].peak,TXDEF[e.kind].total)>0}).map(function(e){const d=TXDEF[e.kind];return{label:d.label,when:e.when,note:d.note,detail:e.detail}})}
function txLogHtml(pid){
  const rows=(S.txLog||[]).filter(function(e){return e.pid===pid}).slice().reverse().slice(0,6);
  if(!rows.length)return '<p style="color:#9fc0cf">No treatments charted yet — give a MAR med, file a vent change, or chart suctioning to see the monitor respond.</p>';
  return rows.map(function(e){const d=TXDEF[e.kind];return '<p>• <b>'+esc(e.detail||(d?d.label:e.kind))+'</b> — <span style="color:#9fc0cf">'+esc(e.when)+'</span><br><span style="color:#9fc0cf">'+esc(d?d.note:'')+'</span></p>'}).join('');
}
</script>

<script>
function startChallenge(i){const c=CHALLENGES[i];if(CH&&!confirm('A challenge is already running — abandon it and start this one?'))return;if(CH)clearInterval(CH.iv);CH={idx:i,tasks:c.tasks.slice(),done:{},taskPts:0,qPts:0,pen:0,wrong:0,qDone:false,end:Date.now()+c.mins*60000,iv:null};cur=c.pid;act='summary';ws='chart';$$('#ws button').forEach(x=>x.classList.toggle('on',x.dataset.w==='chart'));CH.iv=setInterval(tickHud,250);render();updateHud();alert('Challenge started: '+c.name+' — '+c.mins+' minutes.\n\nTasks:\n• '+c.tasks.map(t=>TASKLABEL[t]).join('\n• ')+'\n\nThen answer the end question — it appears at the top of the page as soon as every charting step is done. Wrong picks cost 50 pts; the first attempt is the scored one.');scrollToId('ws-chart')}
function updateHud(){const hud=$('#hud');if(!hud)return;if(!CH){hud.style.display='none';return}hud.style.display='flex';tickHudText()}
function tickHudText(){if(!CH)return;const c=CHALLENGES[CH.idx];const left=Math.max(0,CH.end-Date.now());const s=Math.ceil(left/1000);const doneN=Object.keys(CH.done).length;const pts=Math.max(0,CH.taskPts+CH.qPts-CH.pen);$('#hud').classList.toggle('red',left<60000&&left>0);$('#hudTxt').textContent=c.name+' — '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' left • Steps '+doneN+'/'+CH.tasks.length+' charting'+(questionReady()?' • End question ready':'')+(CH.qDone?' • Question answered':'')+' • '+pts+' pts';const qb=$('#hudQBtn');if(qb)qb.style.display=questionReady()?'':'none'}
function tickHud(){if(!CH)return;if(Date.now()>=CH.end){finishChallenge('timeout');return}tickHudText()}
function noteTask(kind){if(!CH)return;const c=CHALLENGES[CH.idx];if(cur!==c.pid)return;if(CH.tasks.includes(kind)&&!CH.done[kind]){CH.done[kind]=1;CH.taskPts+=100;tickHudText();if(questionReady()){render();const q=$('#qCard');if(q)q.scrollIntoView({behavior:'smooth',block:'start'})}}}
function questionCard(){const c=CHALLENGES[CH.idx];return `<div class="card qcard" id="qCard"><h3>End question — ${esc(c.name)}</h3><p><b>${esc(c.q)}</b></p>${c.opts.map((o,i)=>`<p><button class="btn" id="qopt${i}" onclick="ansQ(${i})">${esc(o)}</button></p>`).join('')}<p class="mut">Wrong picks: −50 pts each and that option locks. The question stays here at the top until you answer it — you can navigate anywhere and come back.</p></div>`}
function jumpToQuestion(){const q=$('#qCard');if(q){q.scrollIntoView({behavior:'smooth',block:'start'});return}render();setTimeout(()=>{const q2=$('#qCard');if(q2)q2.scrollIntoView({behavior:'smooth',block:'start'})},50)}
function ansQ(i){if(!CH||CH.qDone)return;const c=CHALLENGES[CH.idx];if(i===c.ans){CH.qDone=true;CH.qPts=150;finishChallenge('complete')}else{CH.wrong++;CH.pen+=50;const b=$('#qopt'+i);if(b){b.disabled=true;b.style.textDecoration='line-through'}tickHudText();alert('Not quite — −50 pts. First attempt is scored; pick again.')}}
function endRunManual(){if(!CH)return;if(!confirm('End this run now? It will be recorded as ended early.'))return;finishChallenge('manual')}
function finishChallenge(reason){if(!CH)return;const c=CHALLENGES[CH.idx];clearInterval(CH.iv);const doneN=Object.keys(CH.done).length;const timeBonus=reason==='complete'?Math.max(0,Math.round((CH.end-Date.now())/1000)):0;const total=Math.max(0,CH.taskPts+CH.qPts+timeBonus-CH.pen);const max=c.tasks.length*100+150+c.mins*60;const md=medal(total,max);const completed=reason==='complete';const run={name:c.name,pts:total,medal:md,when:nowStr(),completed};S.runs.push(run);save();const taskPts=CH.taskPts,qPts=CH.qPts,pen=CH.pen,wrong=CH.wrong,qDone=CH.qDone;CH=null;const hud=$('#hud');if(hud)hud.style.display='none';ws='chart';$('#app').innerHTML=`<div class="card"><h2>Debrief — ${esc(c.name)}</h2><p style="font-size:20px">${esc(md)} — <b>${total} pts</b> ${completed?'<span class="ok">Run completed</span>':reason==='timeout'?'<span class="bad">Time expired</span>':'<span class="mut">Ended early</span>'}</p><p><b>Points breakdown</b></p><table><tr><th>Component</th><th>Points</th></tr><tr><td>Charting tasks — ${doneN}/${c.tasks.length} done (100 each)</td><td>${taskPts}</td></tr><tr><td>End question ${qDone?'(answered)':'(not answered)'}</td><td>${qPts}</td></tr><tr><td>Time bonus (seconds left, completed runs only)</td><td>${timeBonus}</td></tr><tr><td>Penalties — ${wrong} wrong pick(s) at −50</td><td>−${pen}</td></tr><tr><td><b>Total</b></td><td><b>${total}</b></td></tr></table><p><b>Level now:</b> ${level(totalPts()).cur[0]} — ${totalPts()} pts total</p><p><b>Exam pearl:</b> ${esc(c.pearl)}</p><button class="btn primary" onclick="setWs('lists')">Back to Patient Lists &amp; Challenge Board</button></div>`;$$('#ws button').forEach(x=>x.classList.toggle('on',x.dataset.w==='chart'));$('#unreadBadge').textContent=unread()?String(unread()):'';setStatus('Debrief: '+c.name+' — '+total+' pts '+md)}
render();
</script>
</body></html>
